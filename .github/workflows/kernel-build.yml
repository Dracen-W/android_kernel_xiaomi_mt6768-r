name: Build kernel

on:
  push:
    branches:
      - sixteen-qpr2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: merlin_defconfig
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            python3 \
            rsync

      - name: Fetch Droidspaces non-GKI patches
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            "$RUNNER_TEMP/droidspaces"
          git -C "$RUNNER_TEMP/droidspaces" sparse-checkout set \
            Documentation/resources/kernel-patches/non-GKI
          patch_dir="$RUNNER_TEMP/droidspaces/Documentation/resources/kernel-patches/non-GKI"
          if test -f net/netfilter/xt_qtaguid.c; then
            echo "Applying xt_qtaguid compatibility patch"
            patch --batch --forward --strip=1 < \
              "$patch_dir/01.fix_kernel_panic_in_xt_qtaguid.patch"
          else
            echo "xt_qtaguid was removed from this kernel tree; its patch is not applicable."
          fi
          echo "Applying cgroup compatibility patch"
          patch --batch --forward --strip=1 < \
            "$patch_dir/02.fix_restore cgroup file prefix handling .patch"

      - name: Build merlin kernel
        env:
          ARCH: arm64
          LLVM: 1
          LLVM_IAS: 1
        run: |
          make O="$GITHUB_WORKSPACE/out" merlin_defconfig
          make O="$GITHUB_WORKSPACE/out" -j"$(nproc)" Image.gz dtbs

      - name: Verify kernel artifacts
        run: |
          test -s out/arch/arm64/boot/Image.gz
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -print -quit | grep -q .

      - name: Package pure kernel
        run: |
          mkdir -p release/kernel/dtb
          cp out/arch/arm64/boot/Image.gz release/kernel/
          find out/arch/arm64/boot/dts -type f -name '*.dtb' \
            -exec cp {} release/kernel/dtb/ \;
          cp out/.config release/kernel/
          tar -C release/kernel -czf release/merlin-kernel-${{ github.sha }}.tar.gz .

      - name: Build AnyKernel3 flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git release/anykernel3
          rm -rf release/anykernel3/.git release/anykernel3/patch/* release/anykernel3/ramdisk/*
          cp out/arch/arm64/boot/Image.gz release/anykernel3/Image.gz
          sed -i \
            -e 's/kernel.string=ExampleKernel by osm0sis @ xda-developers/kernel.string=Merlin Droidspaces kernel/' \
            -e 's/do.devicecheck=1/do.devicecheck=1/' \
            -e 's/device.name1=maguro/device.name1=merlin/' \
            -e 's/device.name2=toro/device.name2=/' \
            -e 's/device.name3=toroplus/device.name3=/' \
            -e 's/device.name4=tuna/device.name4=/' \
            -e 's#BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;#BLOCK=auto;#' \
            release/anykernel3/anykernel.sh
          printf 'Merlin Droidspaces kernel\n' > release/anykernel3/banner
          (cd release/anykernel3 && zip -r9 ../merlin-anykernel3-${{ github.sha }}.zip . \
            -x '.git/*' 'README.md' '*placeholder')

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merlin-kernel-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/merlin-kernel-${{ github.sha }}.tar.gz
            release/merlin-anykernel3-${{ github.sha }}.zip